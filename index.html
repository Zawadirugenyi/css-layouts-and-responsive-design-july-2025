    <link rel="stylesheet" href="style.css">
</head>
<body>

        <nav class="nav-bar">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>

    <!-- Main content area using CSS Grid -->
    <main class="grid-container">

        <section class="content">
            <h2>Main Content</h2>
            <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed non risus.</p>

            </div>
        </section>

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Sidebar</h2>
            <ul>
                <li>Item 1</li>
                <li>Item 2</li>
                <li>Item 3</li>
                <li>Item 4</li>
